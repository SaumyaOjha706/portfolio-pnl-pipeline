resources:
  jobs:
    portfolio_pnl_pipeline:
      name: portfolio_pnl_pipeline
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/<your-user>/<repo-folder>/02_bronze
            source: WORKSPACE
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: /Workspace/Users/<your-user>/<repo-folder>/03_silver
            source: WORKSPACE
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: /Workspace/Users/<your-user>/<repo-folder>/04_gold
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
